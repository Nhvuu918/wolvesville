services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wolvesville
      POSTGRES_USER: wolvesville
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_only_change_before_deployment}
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wolvesville -d wolvesville"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - wv_pg_data:/var/lib/postgresql/data
volumes:
  wv_pg_data:
