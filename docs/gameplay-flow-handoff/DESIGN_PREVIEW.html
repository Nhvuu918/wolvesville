<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wolvesville — Design Preview / Sprint 06</title><style>
:root{font-family:Georgia,serif;color:#f1e6d1;background:#110f1f}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 70% 10%,#443259 0%,transparent 45%),#110f1f;padding:24px}.frame{max-width:820px;width:100%;border:1px solid #957951;border-radius:18px;background:linear-gradient(160deg,#292033,#171321);padding:clamp(22px,4vw,48px);box-shadow:0 22px 65px #0009}.banner{border:2px solid #ca9b5f;padding:14px;margin-bottom:28px;font:700 13px system-ui;letter-spacing:.08em;color:#ffe0a4}.step{font:13px system-ui;color:#b4a7cc}.title{font-size:clamp(28px,5vw,48px);margin:14px 0;color:#f4ce88}.status{display:inline-block;padding:5px 12px;font:700 12px system-ui;border:1px solid #957951;border-radius:20px;color:#d9c9a9}p{font-size:18px;line-height:1.7;min-height:125px}button{background:#a07b47;color:#130e17;border:0;padding:13px 25px;border-radius:8px;font:700 14px system-ui;cursor:pointer}button:focus-visible{outline:3px solid #fff}button:disabled{opacity:.4;cursor:default}.foot{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-top:22px}small{color:#b7a9ba;font:12px system-ui}.reduced *{animation:none!important;transition:none!important}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><main class="frame"><div class="banner" role="alert">DESIGN PREVIEW — KHÔNG PHẢI GAMEPLAY · KHÔNG KẾT NỐI BACKEND · KHÔNG PHẢI BẰNG CHỨNG PASS</div><div class="step" id="counter"></div><h1 class="title" id="heading"></h1><div class="status" id="status"></div><p id="description"></p><div class="foot"><button id="previous">← Trước</button><small>Minh họa chuyển trạng thái cho đội đồ họa. Không có dữ liệu thật, điểm, vote hoặc người thắng.</small><button id="next">Tiếp →</button></div></main><script>
// A design storyboard only: never loaded by player frontend, never sends APIs.
const slides=[
 ['Sảnh làng','IMPLEMENTED & TESTED','Người chơi xem phòng từ backend. Nhấn bảng tên để xem trước rồi chọn Tham gia.'],
 ['Phòng chờ','IMPLEMENTED & TESTED','Các thành viên cùng phòng được đồng bộ, host có quyền khóa danh sách.'],
 ['Phân vai riêng','IMPLEMENTED & TESTED','Server quyết định vai. Đồ họa chỉ hiện thẻ vai cho đúng người.'],
 ['Đêm đầu','IMPLEMENTED & TESTED','Engine mở giai đoạn đêm; hiển thị nhân vật và khả năng được phép.'],
 ['Gửi kỹ năng','IMPLEMENTED & TESTED','Hành động được nhận nhưng kết quả chưa xuất hiện khi chỉ ACCEPTED.'],
 ['Phân giải đêm','IMPLEMENTED & TESTED','Engine commit rồi mới gửi kết quả được phép qua WebSocket.'],
 ['Bình minh','IMPLEMENTED & TESTED','Giao diện sáng lên khi server chuyển DAY_DISCUSS. Không tự tạo danh sách người chết.'],
 ['Ghi nhận phiếu','IMPLEMENTED & TESTED','Server nhận phiếu, chỉ người gửi xem lựa chọn của mình. Chưa có luật chốt treo chung.'],
 ['Sói Hòa Bình #79','IMPLEMENTED & TESTED · BỘ BÀI GIỚI HẠN','Nếu PH-02 kích hoạt hợp lệ, server hủy vote; #79 được xem vai mục tiêu riêng tư.'],
 ['Đêm tiếp theo','IMPLEMENTED & TESTED · NHÁNH PH-02','Hủy vote thành công, Engine chuyển sang NIGHT_COLLECT lượt kế tiếp.'],
 ['Treo cổ','BLOCKED BY RULE','Chỉ trình bày vị trí màn hình dự kiến. Không được giả lập người bị treo khi chưa đủ luật.'],
 ['Kết thúc ván','BLOCKED BY RULE','Chưa có kết quả thắng hợp lệ. Màn thắng chỉ là chỗ giữ bố cục cho tương lai.']
];let index=0;function render(){const [title,status,detail]=slides[index];document.getElementById('counter').textContent=`BƯỚC ${index+1}/${slides.length}`;document.getElementById('heading').textContent=title;document.getElementById('status').textContent=status;document.getElementById('description').textContent=detail;document.getElementById('previous').disabled=index===0;document.getElementById('next').disabled=index===slides.length-1}document.getElementById('previous').onclick=()=>{index=Math.max(0,index-1);render()};document.getElementById('next').onclick=()=>{index=Math.min(slides.length-1,index+1);render()};render();
</script></body></html>
